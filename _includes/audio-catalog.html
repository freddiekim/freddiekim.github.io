<script id="yf-audio-catalog" type="application/json">{"music":[{% assign sep = '' %}{% for track in site.data.background_music %}{% if track.youtube_id %}{{ sep }}{"title":{{ track.title | jsonify }},"id":{{ track.youtube_id | strip | jsonify }}}{% assign sep = ',' %}{% endif %}{% endfor %}],"audio":[{% assign sep = '' %}{% for audio in site.data.company_audio %}{% assign audio_ticker = audio.ticker | strip | upcase %}{% assign audio_href = audio.direct_url | default: audio.link_address | default: audio.link | default: audio.url | strip %}{% if audio_ticker != '' and audio_href %}{% assign audio_company = site.data.company_research | where: 'ticker', audio_ticker | first %}{{ sep }}{"ticker":{{ audio_ticker | jsonify }},"name":{{ audio_company.name | default: audio_ticker | jsonify }},"title":{{ audio.title | default: audio.tilte | strip | jsonify }},"href":{{ audio_href | jsonify }}}{% assign sep = ',' %}{% endif %}{% endfor %}]}</script>
